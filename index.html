    <script type="application/ld+json">

        "@context": "https://schema.org",

        "email": "info@limitlessroofing.ca",
        "priceRange": "$$",
        "foundingDate": "2025",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Prince George",
          "addressRegion": "BC",
          "addressCountry": "CA"
        },
        "areaServed": {
          "@type": "State",
          "name": "British Columbia"
        },
        "openingHoursSpecification": [
